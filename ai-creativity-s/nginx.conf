worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Resolve relative paths against the Nginx installation prefix (-p).
    include conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    server {
        listen 80;
        server_name localhost;

        # Replace both frontend roots and the deployment alias for your machine.
        location / {
            root D:/Code_Program/Program/ai-no-code/ai-creativity-s/yu-ai-code-mother-frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /assets/ {
            root D:/Code_Program/Program/ai-no-code/ai-creativity-s/yu-ai-code-mother-frontend/dist;
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location ~ "^/([A-Za-z0-9]{6})(/.*)?$" {
            alias D:/Code_Program/Program/ai-no-code/ai-creativity-s/tmp/code_deploy/$1/;
            try_files $2 $2/ /index.html;

            location ~* "\.(css|js|png|jpg|jpeg|gif|ico|svg)$" {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
